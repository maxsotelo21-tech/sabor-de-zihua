<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>El Sabor de Zihua · Menú</title>
<meta name="description" content="Menú digital de El Sabor de Zihua, restaurante de desayunos frente al mar.">
<meta name="theme-color" content="#E8174F">
<link rel="icon" href="img/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="img/logo.svg">
<style>
:root{
  --red:#E8174F; --red-d:#C40F3F; --sun:#FFD400; --sun2:#F6B12A; --peach:#F8C4A6; --peach2:#FBD8C3;
  --sea:#00A2D3; --sea-d:#0087B5; --leaf:#7A9A48; --leaf2:#3FA535; --ink:#1E1B1B; --muted:#5d4f4a; --paper:#fff;
  --ease:cubic-bezier(.2,0,0,1); --pop:cubic-bezier(.175,.885,.32,1.275); --soft:cubic-bezier(.4,0,.2,1);
  --r:26px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:auto;-webkit-text-size-adjust:100%}
body{font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:var(--peach);overflow-x:hidden;min-height:100vh}
body::before{content:"";position:fixed;inset:0;background:url(img/texture.jpg) center/cover;opacity:.32;mix-blend-mode:multiply;pointer-events:none;z-index:-1}
body.locked{overflow:hidden}
img,video{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
a{color:inherit}

/* ---------- splash ---------- */
.splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--peach2);transition:transform .7s var(--soft) .1s, opacity .4s ease .5s}
.splash-in{position:relative;display:grid;place-items:center}
.splash .sun{position:absolute;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle at 40% 40%,var(--sun) 55%,var(--sun2) 56%);top:-70px;left:calc(50% - 85px);animation:rise 1s var(--pop) both}
.splash img{width:min(64vw,280px);position:relative;animation:popin .8s var(--pop) .25s both}
body.ready .splash{transform:translateY(-100%);opacity:0;pointer-events:none}
@keyframes rise{from{transform:translateY(120px) scale(.6);opacity:0}}
@keyframes popin{from{transform:scale(.4) rotate(-8deg);opacity:0}}

/* ---------- top bar ---------- */
.topbar{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;pointer-events:none}
.topbar .mini{height:38px;opacity:0;transform:translateY(-12px);transition:.35s var(--ease)}
body.scrolled .topbar .mini{opacity:1;transform:none}
.lang{pointer-events:auto;font:800 13px/1 Montserrat;letter-spacing:.12em;background:#fff;color:var(--red);padding:10px 14px;border-radius:99px;box-shadow:0 6px 18px rgba(120,40,20,.18);transition:transform .15s var(--ease)}
.lang:active{transform:scale(.92)}

/* ---------- hero ---------- */
.hero{position:relative;height:100svh;min-height:600px;overflow:hidden;display:grid;place-items:center;text-align:center;color:#fff;isolation:isolate}
.hero video,.hero .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-3;transform:translateY(calc(var(--py,0)*.35px)) scale(1.08)}
.hero::after{content:"";position:absolute;inset:0;z-index:-2;background:linear-gradient(180deg,rgba(248,196,166,.55) 0%,rgba(248,196,166,0) 35%,rgba(0,40,60,.05) 60%,rgba(232,23,79,.25) 100%)}
.hero .sunbig{position:absolute;z-index:-1;top:-120px;left:-120px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle at 62% 62%,var(--sun2) 0 44%,var(--sun) 45% 70%,transparent 71%);animation:sunpulse 6s ease-in-out infinite}
.hero .sunbig::before{content:"";position:absolute;inset:-40px;border-radius:50%;background:repeating-conic-gradient(rgba(255,212,0,.35) 0 6deg,transparent 6deg 18deg);mask:radial-gradient(circle,transparent 58%,#000 60%,transparent 72%);-webkit-mask:radial-gradient(circle,transparent 58%,#000 60%,transparent 72%);animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
@keyframes sunpulse{50%{transform:scale(1.05)}}
.birds{position:absolute;top:14%;right:-10%;width:150px;z-index:-1;animation:fly 18s linear infinite}
.birds img{width:100%;animation:flap .9s ease-in-out infinite}
@keyframes fly{from{transform:translate(0,0)}to{transform:translate(-130vw,-60px)}}
@keyframes flap{50%{transform:scaleY(.75) translateY(3px)}}
.paper{background:#fff;padding:34px 34px 26px;border-radius:46% 54% 50% 50%/14% 16% 18% 16%;box-shadow:0 30px 60px -20px rgba(120,30,20,.45);position:relative;margin-top:-6vh;opacity:0;transform:translateY(30px) scale(.9)}
body.ready .paper{animation:paperin .9s var(--pop) .15s forwards}
@keyframes paperin{to{opacity:1;transform:none}}
.paper img{width:min(58vw,250px)}
.tagline{display:block;margin-top:10px;font:800 12px/1.2 Montserrat;letter-spacing:.32em;text-transform:uppercase;color:var(--red)}
.cta{position:absolute;bottom:calc(120px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;font:800 13px Montserrat;letter-spacing:.18em;text-transform:uppercase;text-shadow:0 2px 10px rgba(0,0,0,.35);text-decoration:none;opacity:0}
body.ready .cta{animation:fadeup .6s var(--ease) .9s forwards}
.cta i{width:44px;height:44px;border-radius:50%;background:var(--red);display:grid;place-items:center;box-shadow:0 8px 22px rgba(232,23,79,.5);animation:bob 1.8s ease-in-out infinite}
.cta i::before{content:"";width:10px;height:10px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-2px,-2px)}
@keyframes bob{50%{transform:translateY(7px)}}
@keyframes fadeup{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}

/* waves */
.waves{position:absolute;left:0;right:0;bottom:-1px;height:120px;z-index:-1;overflow:hidden}
.waves svg{position:absolute;bottom:0;width:200%;height:100%}
.waves .w1{animation:drift 14s linear infinite}
.waves .w2{animation:drift 9s linear infinite reverse;opacity:.9}
.waves .w3{animation:drift 22s linear infinite}
@keyframes drift{to{transform:translateX(-50%)}}

/* ---------- tabs + nav ---------- */
#tabs{display:none}
#nav{position:sticky;top:0;z-index:30;padding:calc(8px + env(safe-area-inset-top)) 0 8px;transition:background .3s,box-shadow .3s}
body.scrolled #nav{background:rgba(251,216,195,.86);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);box-shadow:0 8px 24px -14px rgba(120,40,20,.4)}
body.scrolled #nav{padding-left:58px}
body.scrolled .nav-track{-webkit-mask-image:linear-gradient(90deg,transparent,#000 18px);mask-image:linear-gradient(90deg,transparent,#000 18px)}
.nav-track{display:flex;gap:8px;overflow-x:auto;padding:4px 16px;scrollbar-width:none;scroll-snap-type:x proximity}
.nav-track::-webkit-scrollbar{display:none}
.nav-track a{flex:none;scroll-snap-align:center;text-decoration:none;font:800 12px/1 Montserrat;letter-spacing:.14em;text-transform:uppercase;padding:11px 16px;border-radius:99px;background:#fff;color:var(--ink);box-shadow:0 3px 0 rgba(120,40,20,.12);transition:background .25s var(--ease),color .25s,transform .15s}
.nav-track a.on{background:var(--red);color:#fff;transform:translateY(-1px)}
.nav-track a:active{transform:scale(.94)}
body.scrolled .topbar .mini{position:fixed;left:12px;top:calc(9px + env(safe-area-inset-top));height:34px;z-index:41}

/* ---------- featured ---------- */
main{max-width:760px;margin:0 auto;padding:6px 0 40px}
#featured{padding:22px 0 6px}
.feat-head{display:flex;align-items:baseline;justify-content:space-between;padding:0 20px 12px}
.feat-head h2{font:900 clamp(26px,7vw,36px)/1 Montserrat;color:var(--red);letter-spacing:-.01em}
.swipe{font:700 13px Nunito;color:var(--muted)}
.swipe i{display:inline-block;font-style:normal;animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(5px)}}
.feat-track{display:flex;gap:14px;overflow-x:auto;padding:6px 20px 22px;scroll-snap-type:x mandatory;scrollbar-width:none}
.feat-track::-webkit-scrollbar{display:none}
.feat-card{position:relative;flex:none;width:min(66vw,300px);aspect-ratio:4/5.4;border-radius:var(--r);overflow:hidden;scroll-snap-align:center;background:#f3d2c0;box-shadow:0 18px 30px -16px rgba(120,30,20,.55);transform:translateY(24px) scale(.94);opacity:0;transition:transform .55s var(--pop) calc(var(--i)*70ms),opacity .4s ease calc(var(--i)*70ms)}
#featured .reveal.in ~ .feat-track .feat-card,#featured.in .feat-card{opacity:1;transform:none}
.feat-card:active{transform:scale(.97)!important;transition-duration:.15s}
.feat-media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.feat-card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(30,10,10,.78))}
.feat-info{position:absolute;left:16px;right:16px;bottom:14px;z-index:1;color:#fff;display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.feat-name{font:800 19px/1.1 Montserrat;text-wrap:balance}
.feat-price{flex:none;font:900 15px Montserrat;background:var(--sun);color:var(--ink);padding:7px 10px;border-radius:12px;transform:rotate(-4deg)}
.live{position:absolute;z-index:1;top:12px;left:12px;font:800 10px Montserrat;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);padding:6px 9px;border-radius:99px;display:flex;gap:6px;align-items:center}
.live b{width:7px;height:7px;border-radius:50%;background:var(--red);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}

/* ---------- sections ---------- */
.sec{position:relative;background:var(--paper);margin:26px 14px;padding:30px 22px 22px;border-radius:30px 36px 28px 40px/34px 28px 40px 30px;box-shadow:0 22px 40px -28px rgba(120,30,20,.55);opacity:0;transform:translateY(40px) rotate(.4deg);transition:transform .7s var(--pop),opacity .5s ease}
.sec:nth-child(even){transform:translateY(40px) rotate(-.4deg)}
.sec.in{opacity:1;transform:none}
.sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.sec-head h2{font:900 clamp(22px,6.2vw,30px)/1 Montserrat;letter-spacing:.2em;text-transform:uppercase;color:var(--red)}
.kicker{font:900 15px Montserrat;letter-spacing:.14em;color:var(--red)}
.note{font-size:14px;color:var(--muted);font-style:italic;margin:-4px 0 12px}
.items{display:flex;flex-direction:column}
.item{display:flex;gap:14px;align-items:center;width:100%;padding:12px 0;border-top:1px dashed rgba(232,23,79,.18);opacity:0;transform:translateX(-14px);transition:transform .45s var(--ease) calc(var(--i)*35ms),opacity .4s ease calc(var(--i)*35ms)}
.item:first-child{border-top:0}
.sec.in .item{opacity:1;transform:none}
.item.has-media{border-radius:18px;transition:transform .45s var(--ease) calc(var(--i)*35ms),opacity .4s ease calc(var(--i)*35ms),background .2s}
.item.has-media:active{background:#fff2ea;transform:scale(.98)}
.thumb{position:relative;flex:none;width:78px;height:78px;border-radius:20px;overflow:hidden;background:#f6d6c5;box-shadow:0 8px 16px -8px rgba(120,30,20,.6)}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;transition:transform .5s var(--ease)}
.item.has-media:hover .thumb img{transform:scale(1.08)}
.play{position:absolute;right:6px;bottom:6px;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center}
.play::before{content:"";margin-left:2px;border:5px solid transparent;border-left:8px solid var(--red);border-right:0}
.txt{flex:1;min-width:0}
.row{display:flex;align-items:baseline;gap:8px}
.name{font:800 16.5px/1.25 Nunito}
.badge{font-style:normal;color:var(--sun2);display:inline-block;animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{50%{transform:scale(1.3) rotate(20deg)}}
.dots{flex:1;border-bottom:2px dotted rgba(30,27,27,.18);transform:translateY(-4px);min-width:14px}
.price{font:900 16px Montserrat;color:var(--red);white-space:nowrap}
.desc{display:block;font-size:14.5px;line-height:1.38;color:var(--muted);margin-top:3px}
.extras{margin-top:14px;padding-top:12px;border-top:2px solid #fde3d7}
.ex-title{font:700 13px Nunito;font-style:italic;text-decoration:underline;text-underline-offset:3px;color:var(--muted);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:700 14px Nunito;background:#FFF1E8;border-radius:99px;padding:8px 13px}
.chip b{font:900 13px Montserrat;color:var(--red);margin-left:4px}
.foot-notes{text-align:center;font-size:13px;color:var(--muted);padding:10px 24px;opacity:0;transition:opacity .6s}
.foot-notes.in{opacity:1}

/* deco: iguana on specialties */
.sec[data-deco=iguana]{margin-top:120px}
.sec[data-deco=iguana]::before{content:"";position:absolute;width:118px;height:150px;right:-6px;top:-128px;background:url(img/iguana.svg) center/contain no-repeat;transform-origin:70% 20%;transform:translateX(70px) rotate(25deg);opacity:0;transition:transform 1s var(--pop) .25s,opacity .4s .25s}
.sec[data-deco=iguana].in::before{transform:none;opacity:1;animation:breathe 4s ease-in-out 1.4s infinite}
@keyframes breathe{50%{transform:rotate(-3deg) translateY(2px)}}
/* deco: juice bubbles */
.sec[data-deco=juice]{overflow:hidden}
.sec[data-deco=juice] .sec-head::after{content:"";position:absolute;right:18px;top:14px;width:70px;height:90px;background:
  radial-gradient(circle,#FFD400 0 5px,transparent 6px) 10px 70px/20px 20px no-repeat,
  radial-gradient(circle,#7BC043 0 4px,transparent 5px) 40px 80px/20px 20px no-repeat,
  radial-gradient(circle,#F6B12A 0 6px,transparent 7px) 26px 60px/20px 20px no-repeat;animation:bubbles 3.2s ease-in infinite}
@keyframes bubbles{0%{transform:translateY(20px);opacity:0}30%{opacity:1}100%{transform:translateY(-60px);opacity:0}}

/* ---------- footer ---------- */
footer{position:relative;margin-top:60px;background:var(--sea);color:#fff;text-align:center;padding:90px 24px calc(40px + env(safe-area-inset-bottom));overflow:hidden}
footer .waves{top:-1px;bottom:auto;transform:scaleY(-1)}
footer .hib{position:absolute;right:-30px;top:-10px;width:200px;transform-origin:60% 90%;animation:sway 5s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(-5deg)}}
footer .flogo{width:180px;margin:0 auto 14px;background:#fff;padding:14px 18px;border-radius:24px}
footer p{font-size:13px;opacity:.95;max-width:420px;margin:8px auto 0;line-height:1.5}
footer a{color:#fff;font-weight:800}
#toTop{margin-top:18px;font:800 12px Montserrat;letter-spacing:.16em;text-transform:uppercase;background:var(--sun);color:var(--ink);padding:12px 18px;border-radius:99px}

/* ---------- sheet ---------- */
#sheet{position:fixed;inset:0;z-index:60;background:rgba(30,10,10,0);display:flex;align-items:flex-end;justify-content:center;transition:background .35s}
#sheet[hidden]{display:none}
#sheet.open{background:rgba(30,10,10,.55)}
.sheet-card{position:relative;width:100%;max-width:560px;max-height:92vh;overflow:auto;background:#fff;border-radius:30px 30px 0 0;transform:translateY(100%);transition:transform .45s cubic-bezier(.05,.7,.1,1)}
#sheet.open .sheet-card{transform:none}
.sheet-card::before{content:"";position:absolute;z-index:3;top:8px;left:50%;width:44px;height:5px;margin-left:-22px;border-radius:9px;background:rgba(255,255,255,.85)}
.sheet-close{position:absolute;z-index:3;top:14px;right:14px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;font:700 22px/1 Nunito;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.sheet-media{position:relative;aspect-ratio:1/1;max-height:62vh;width:100%;background:#f6d6c5;overflow:hidden}
.sheet-media .sm{width:100%;height:100%;object-fit:cover;animation:kenburns 9s ease-out both}
@keyframes kenburns{from{transform:scale(1.15)}}
.ph{position:absolute;left:12px;bottom:10px;font-size:11px;color:#fff;background:rgba(0,0,0,.35);padding:4px 8px;border-radius:8px}
.sheet-txt{padding:20px 22px calc(26px + env(safe-area-inset-bottom))}
.sheet-txt h3{font:900 25px/1.1 Montserrat;color:var(--red);margin-bottom:8px}
.sheet-txt p{font-size:16px;line-height:1.5;color:var(--muted)}
.sheet-price{margin-top:16px;display:flex;gap:10px}
.sheet-price span{font:900 22px Montserrat;background:var(--sun);padding:9px 14px;border-radius:14px;display:inline-flex;gap:6px;align-items:baseline;animation:popin .5s var(--pop) .15s both}
.sheet-price small{font:800 11px Montserrat;opacity:.7}

body.switching main{opacity:0;transition:opacity .2s}

@media (min-width:760px){
  .feat-card{width:280px}
  .sec{margin:30px 20px;padding:36px 34px 28px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .sec,.item,.feat-card,.paper,.cta{opacity:1!important;transform:none!important}
}
</style>
</head>
<body>
<div class="splash" aria-hidden="true"><div class="splash-in"><div class="sun"></div><img src="img/logo.svg" alt=""></div></div>

<div class="topbar"><img class="mini" src="img/logo.svg" alt=""><button id="langBtn" class="lang" aria-label="Cambiar idioma / Change language">EN</button></div>

<header class="hero">
  <img class="poster" src="media/hero-beach.jpg" alt="">
  <video src="media/hero-beach.mp4" poster="media/hero-beach.jpg" autoplay muted loop playsinline aria-hidden="true"></video>
  <div class="sunbig" aria-hidden="true"></div>
  <div class="birds" aria-hidden="true"><img src="img/birds.svg" alt=""></div>
  <div class="paper">
    <h1><img src="img/logo.svg" alt="El Sabor de Zihua · Restaurante"></h1>
    <span class="tagline" data-i18n="tagline">Desayunos frente al mar</span>
  </div>
  <a class="cta" href="#featured"><span data-i18n="scroll">Ver menú</span><i></i></a>
  <div class="waves" aria-hidden="true">
    <svg class="w3" viewBox="0 0 1440 120" preserveAspectRatio="none"><path fill="#7A9A48" d="M0 50 C180 10 360 10 540 40 S900 80 1080 40 1260 10 1440 50 V120 H0Z M1440 50 C1620 10 1800 10 1980 40 S2340 80 2520 40 2700 10 2880 50 V120 H1440Z" transform="scale(.5 1)"/></svg>
    <svg class="w2" viewBox="0 0 1440 120" preserveAspectRatio="none"><path fill="#0087B5" d="M0 70 C240 40 480 100 720 70 S1200 40 1440 70 V120 H0Z M1440 70 C1680 40 1920 100 2160 70 S2640 40 2880 70 V120 H1440Z" transform="scale(.5 1)"/></svg>
    <svg class="w1" viewBox="0 0 1440 120" preserveAspectRatio="none"><path fill="#F8C4A6" d="M0 92 C240 70 480 112 720 92 S1200 70 1440 92 V120 H0Z M1440 92 C1680 70 1920 112 2160 92 S2640 70 2880 92 V120 H1440Z" transform="scale(.5 1)"/></svg>
  </div>
</header>

<div id="tabs" role="tablist"></div>
<nav id="nav" aria-label="Secciones"></nav>

<main>
  <section id="featured"></section>
  <div id="sections"></div>
</main>

<footer>
  <div class="waves" aria-hidden="true">
    <svg class="w1" viewBox="0 0 1440 120" preserveAspectRatio="none"><path fill="#F8C4A6" d="M0 92 C240 70 480 112 720 92 S1200 70 1440 92 V120 H0Z M1440 92 C1680 70 1920 112 2160 92 S2640 70 2880 92 V120 H1440Z" transform="scale(.5 1)"/></svg>
  </div>
  <img class="hib" src="img/hibiscus.svg" alt="" aria-hidden="true">
  <img class="flogo" src="img/logo.svg" alt="El Sabor de Zihua">
  <p data-i18n="credits"></p>
  <button id="toTop">↑ Top</button>
</footer>

<div id="sheet" hidden role="dialog" aria-modal="true">
  <div class="sheet-card"><button class="sheet-close" aria-label="Cerrar">×</button><div class="sheet-body"></div></div>
</div>

<script src="data.js"></script>
<script src="menu.js"></script>
<script>
  // los destacados se animan al entrar en pantalla
  new IntersectionObserver((e,o)=>e.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');o.disconnect()}}),{threshold:.15}).observe(document.getElementById('featured'));
</script>
</body>
</html>
